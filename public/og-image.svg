<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11097e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0b0651;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a11a8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="530" r="200" fill="#ffffff" opacity="0.05"/>
  
  <!-- Book icon -->
  <rect x="520" y="80" width="160" height="120" rx="10" fill="#ffffff" opacity="0.15"/>
  <line x1="540" y1="110" x2="660" y2="110" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  <line x1="540" y1="130" x2="660" y2="130" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  <line x1="540" y1="150" x2="620" y2="150" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  
  <!-- Main title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    Urdu Sharah Library
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="42" fill="#f5e6e6" text-anchor="middle">
    Kanzul Madaris Digital Library
  </text>
  
  <!-- Divider line -->
  <line x1="350" y1="380" x2="850" y2="380" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Features -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">
    📚 300+ Books  |  📖 Sharahs  |  📝 Past Papers
  </text>
  
  <!-- Bottom text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="30" fill="#f5e6e6" text-anchor="middle">
    Complete Dars-e-Nizami Curriculum (8 Years)
  </text>
  
  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.8">
    https://books-library-ashy.vercel.app
